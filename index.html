<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Ledger">
  
  <title>Family Ledger</title>
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9554/9554904.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #ccfbf1;
      --accent: #14b8a6;
      --expense: #f43f5e;
      --income: #10b981;
      --loan: #3b82f6;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* INSTALL APP BANNER */
    .install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: #0f172a;
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10000;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 50px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .install-banner-text {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .install-banner-text img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .install-banner-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-install-now {
      background: var(--accent);
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-install-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
    }

    /* AUTH SCREEN */
    .auth-wrapper {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 36px 28px;
      border: 1px solid var(--border);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
      box-shadow: 0 8px 16px -4px rgba(13, 148, 136, 0.4);
    }

    .auth-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .auth-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      background: #f8fafc;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .input-box:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .forgot-link-wrap {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 16px;
    }

    .forgot-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .forgot-btn:hover { text-decoration: underline; }

    .btn-main {
      width: 100%;
      padding: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 15px;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { opacity: 0.7; cursor: not-allowed; }

    .switch-auth-mode {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      margin-left: 4px;
    }

    /* MAIN APP LAYOUT */
    .app-shell {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .app-topbar {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .user-name {
      font-size: 15px;
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-chip {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-chip:hover { background: rgba(255, 255, 255, 0.25); }

    /* DASHBOARD */
    .dashboard-overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .metric-card {
      background: var(--surface);
      padding: 12px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      text-align: center;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .val-inc { color: var(--income); }
    .val-exp { color: var(--expense); }
    .val-bal { color: var(--text); }

    /* ACTION BAR */
    .nav-tabs {
      display: flex;
      padding: 12px 16px 0 16px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .nav-tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .app-content {
      padding: 20px 16px;
    }

    /* TRANSACTION FORM */
    .type-pill-group {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-full);
      gap: 4px;
      margin-bottom: 20px;
    }

    .type-pill {
      flex: 1;
      border: none;
      padding: 8px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .type-pill.active[data-mode="income"] { background: var(--income); color: white; }
    .type-pill.active[data-mode="expense"] { background: var(--expense); color: white; }
    .type-pill.active[data-mode="loan"] { background: var(--loan); color: white; }

    .amount-calc-wrap {
      display: flex;
      gap: 8px;
    }

    .btn-calc {
      padding: 0 16px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 16px;
    }

    .select-wrap {
      position: relative;
    }
    .select-wrap select {
      appearance: none;
      -webkit-appearance: none;
    }
    .select-wrap::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* REPORT SECTION */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filter-summary-box {
      display: flex;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .table-responsive {
      overflow-x: auto;
      max-height: 380px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      background: #f8fafc;
      padding: 10px 12px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .badge-amt {
      font-weight: 800;
      white-space: nowrap;
    }

    .status-alert {
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 14px;
      display: none;
      line-height: 1.4;
    }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #ffe4e6; color: #be123c; }

    /* CALCULATOR MODAL */
    .calc-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }

    .calc-dialog {
      background: var(--surface);
      width: 100%;
      max-width: 320px;
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-lg);
    }

    .calc-display {
      width: 100%;
      height: 48px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      text-align: right;
      padding: 8px 14px;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
      outline: none;
    }

    .calc-pad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .c-btn {
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
    }
    .c-btn:active { background: #e2e8f0; }
    .c-btn.c-op { background: var(--primary-light); color: var(--primary-dark); border-color: transparent; }
    .c-btn.c-eq { background: var(--primary); color: white; border-color: transparent; grid-column: span 2; }
    .c-btn.c-del { background: #fee2e2; color: #ef4444; border-color: transparent; }

    @media (max-width: 480px) {
      body { padding: 0; }
      .app-shell, .auth-wrapper {
        border-radius: 0;
        min-height: 100vh;
        border: none;
      }
    }
  </style>
</head>
<body>

  <!-- PWA INSTALL PROMPT BANNER -->
  <div class="install-banner" id="pwaBanner">
    <div class="install-banner-text">
      <img src="https://cdn-icons-png.flaticon.com/512/9554/9554904.png" alt="App Icon">
      <span>ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്യണോ?</span>
    </div>
    <div class="install-banner-btns">
      <button type="button" class="btn-install-now" onclick="triggerPwaInstall()">Install</button>
      <button type="button" class="btn-install-close" onclick="closePwaBanner()">✕</button>
    </div>
  </div>

  <!-- AUTHENTICATION VIEW -->
  <div class="auth-wrapper" id="authView">
    <div class="auth-header">
      <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
      <h2 id="authHeading" data-i18n="auth_login_title">ലോഗിൻ ചെയ്യുക</h2>
      <p data-i18n="auth_subtitle">നിങ്ങളുടെ വരവ്-ചെലവുകൾ കൃത്യമായി സൂക്ഷിക്കുക</p>
    </div>

    <form onsubmit="handleAuth(event)">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label data-i18n="lbl_name">പേര്</label>
        <input type="text" id="authName" class="input-box" placeholder="User Name">
      </div>
      <div class="form-group">
        <label data-i18n="lbl_email">ഇമെയിൽ വിലാസം</label>
        <input type="email" id="authEmail" class="input-box" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label data-i18n="lbl_pass">പാസ്‌വേഡ്</label>
        <input type="password" id="authPass" class="input-box" placeholder="••••••••" required>
      </div>

      <!-- Forgot Password Link -->
      <div class="forgot-link-wrap" id="forgotPassWrap">
        <button type="button" class="forgot-btn" onclick="handleForgotPassword()" data-i18n="btn_forgot_pass">Forgot password?</button>
      </div>

      <button type="submit" class="btn-main" id="authSubmitBtn">
        <span id="authBtnText">ലോഗിൻ</span>
      </button>
    </form>

    <div class="switch-auth-mode">
      <span id="switchPrompt">അക്കൗണ്ട് ഇല്ലേ?</span>
      <button type="button" class="btn-text" id="switchBtn" onclick="toggleAuthMode()">പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കുക</button>
    </div>

    <div id="authAlert" class="status-alert"></div>
  </div>

  <!-- MAIN APP VIEW -->
  <div class="app-shell" id="mainAppView" style="display: none;">
    <!-- TOP BAR -->
    <div class="app-topbar">
      <div class="user-info">
        <div class="user-avatar" id="avatarInitial">U</div>
        <div class="user-name" id="userNameLabel">User</div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn-chip" onclick="triggerPwaInstall()" id="topInstallBtn">
          <i class="fa-solid fa-download"></i> Install
        </button>
        <button type="button" class="btn-chip" onclick="toggleLanguage()" id="langToggleBtn">English</button>
        <button type="button" class="btn-chip" onclick="handleLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard-overview">
      <div class="metric-card">
        <div class="metric-label" data-i18n="dash_inc">ഈ മാസത്തെ വരവ്</div>
        <div class="metric-value val-inc" id="dashInc">₹0.00</div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="dash_exp">ഈ മാസത്തെ ചെലവ്</div>
        <div class="metric-value val-exp" id="dashExp">₹0.00</div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="dash_bal">ആകെ ബാക്കി തുക</div>
        <div class="metric-value val-bal" id="dashBal">₹0.00</div>
      </div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="nav-tabs">
      <button type="button" class="nav-tab-btn active" id="tabEntryBtn" onclick="switchView('entry')">
        <i class="fa-solid fa-plus-circle"></i> <span data-i18n="tab_add">പുതിയ ഇടപാട്</span>
      </button>
      <button type="button" class="nav-tab-btn" id="tabReportBtn" onclick="switchView('report')">
        <i class="fa-solid fa-chart-pie"></i> <span data-i18n="tab_report">റിപ്പോർട്ട്</span>
      </button>
    </div>

    <div class="app-content">
      <!-- 1. ENTRY SECTION -->
      <div id="entrySection">
        <div class="type-pill-group">
          <button type="button" class="type-pill active" data-mode="income" onclick="setMode('income')" data-i18n="type_inc">വരവ്</button>
          <button type="button" class="type-pill" data-mode="expense" onclick="setMode('expense')" data-i18n="type_exp">ചെലവ്</button>
          <button type="button" class="type-pill" data-mode="loan" onclick="setMode('loan')" data-i18n="type_loan">കടം ഇടപാട്</button>
        </div>

        <form id="ledgerForm" onsubmit="handleTransactionSubmit(event)">
          <input type="hidden" id="entryType" value="വരവ്">

          <div class="form-group">
            <label data-i18n="lbl_date">തീയതി</label>
            <input type="date" id="entryDate" class="input-box" required>
          </div>

          <div class="form-group" id="loanGroupField" style="display: none;">
            <label data-i18n="lbl_loan_type">കടം ഇടപാട് തരം</label>
            <div class="select-wrap">
              <select id="loanSubtype" class="input-box" onchange="updateEntryType()">
                <option value="കടം വാങ്ങിയത്" data-i18n-opt="loan_borrowed">കടം വാങ്ങിയത്</option>
                <option value="കടം കൊടുത്തത്" data-i18n-opt="loan_given">കടം കൊടുത്തത്</option>
                <option value="കടം തിരിച്ചു കൊടുത്തത്" data-i18n-opt="loan_repaid">കടം തിരിച്ചു കൊടുത്തത്</option>
                <option value="കടം തിരിച്ചു കിട്ടിയത്" data-i18n-opt="loan_received">കടം തിരിച്ചു കിട്ടിയത്</option>
              </select>
            </div>
          </div>

          <div class="form-group" id="personGroupField">
            <label data-i18n="lbl_person">ആരുമായി? (വ്യക്തിയുടെ പേര്)</label>
            <input type="text" id="entryPerson" class="input-box" placeholder="പേര് എഴുതുക...">
          </div>

          <div class="form-group">
            <label data-i18n="lbl_category">വിഭാഗം</label>

    // 🌟 ഫോർഗോട്ട് പാസ്‌വേഡ് ഫങ്ക്ഷൻ
    function handleForgotPassword() {
      const email = document.getElementById('authEmail').value.trim();
      const alertBox = document.getElementById('authAlert');

      if (!email) {
        alertBox.className = "status-alert status-error";
        alertBox.innerText = (lang === 'ml') ? "ദയവായി നിങ്ങളുടെ ഇമെയിൽ വിലാസം ടൈപ്പ് ചെയ്യുക!" : "Please enter your email address first!";
        alertBox.style.display = 'block';
        return;
      }

      auth.sendPasswordResetEmail(email)
        .then(() => {
          alertBox.className = "status-alert status-success";
          alertBox.innerText = (lang === 'ml') ? "പാസ്‌വേഡ് റീസെറ്റ് ചെയ്യാനുള്ള ലിങ്ക് ഇമെയിലിലേക്ക് അയച്ചിട്ടുണ്ട്. മെയിൽ പരിശോധിക്കുക!" : "Password reset link has been sent to your email!";
          alertBox.style.display = 'block';
        })
        .catch((err) => {
          alertBox.className = "status-alert status-error";
          alertBox.innerText = err.message;
          alertBox.style.display = 'block';
        });
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value;
      const name = document.getElementById('authName').value.trim();
      const btn = document.getElementById('authSubmitBtn');
      const alertBox = document.getElementById('authAlert');

      btn.disabled = true;
      alertBox.style.display = 'none';

      if (isSignUp) {
        auth.createUserWithEmailAndPassword(email, pass)
          .then((cred) => {
            if (name) cred.user.updateProfile({ displayName: name });
          })
          .catch((err) => {
            alertBox.className = "status-alert status-error";
            alertBox.style.display = 'block';
            alertBox.innerText = err.message;
            btn.disabled = false;
          });
      } else {
        auth.signInWithEmailAndPassword(email, pass)
          .catch((err) => {
            alertBox.className = "status-alert status-error";
            alertBox.style.display = 'block';
            // ഉപയോക്താവിന് മനസ്സിലാകുന്ന രീതിയിലുള്ള എറർ മെസ്സേജ്
            if (err.code === 'auth/invalid-login-credentials' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
              alertBox.innerText = (lang === 'ml') ? "ഇമെയിൽ അല്ലെങ്കിൽ പാസ്‌വേഡ് തെറ്റാണ്. പരിശോധിക്കുക!" : "Incorrect email or password. Please check!";
            } else {
              alertBox.innerText = err.message;
            }
            btn.disabled = false;
          });
      }
    }

    function switchView(view) {
      const entry = document.getElementById('entrySection');
      const report = document.getElementById('reportSection');
      const tabEntry = document.getElementById('tabEntryBtn');
      const tabReport = document.getElementById('tabReportBtn');

      if (view === 'entry') {
        entry.style.display = 'block';
        report.style.display = 'none';
        tabEntry.classList.add('active');
        tabReport.classList.remove('active');
      } else {
        entry.style.display = 'none';
        report.style.display = 'block';
        tabEntry.classList.remove('active');
        tabReport.classList.add('active');
        renderReport();
      }
    }

    function setMode(m) {
      currentMode = m;
      document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
      document.querySelector(`[data-mode="${m}"]`).classList.add('active');

      const loanField = document.getElementById('loanGroupField');
      const personField = document.getElementById('personGroupField');
      const inputType = document.getElementById('entryType');

      updateCategoryList();
      document.getElementById('customCatGroup').style.display = 'none';

      if (m === 'expense') {
        loanField.style.display = 'none';
        personField.style.display = 'none';
        inputType.value = (lang === 'ml') ? 'ചെലവ്' : 'Expense';
      } else if (m === 'income') {
        loanField.style.display = 'none';
        personField.style.display = 'none';
        inputType.value = (lang === 'ml') ? 'വരവ്' : 'Income';
      } else if (m === 'loan') {
        loanField.style.display = 'block';
        personField.style.display = 'block';
        updateEntryType();
      }
    }

    function updateCategoryList() {
      const select = document.getElementById('entryCategory');
      select.innerHTML = `<option value="" disabled selected>${dict[lang].select_placeholder}</option>`;
      
      categories[lang][currentMode].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = 'NEW_CAT';
      newOpt.innerText = dict[lang].new_cat_opt;
      select.appendChild(newOpt);
    }

    function handleCategoryChange(sel) {
      const customGroup = document.getElementById('customCatGroup');
      if (sel.value === 'NEW_CAT') {
        customGroup.style.display = 'block';
        document.getElementById('customCategoryInput').required = true;
      } else {
        customGroup.style.display = 'none';
        document.getElementById('customCategoryInput').required = false;
      }
    }

    function bindUserTransactions(uid) {
      if (unsubSnapshot) unsubSnapshot();

      unsubSnapshot = db.collection("users").doc(uid).collection("transactions")
        .onSnapshot((snapshot) => {
          let mInc = 0, mExp = 0, tInc = 0, tExp = 0;
          rawData = [];
          
          const now = new Date();
          const currM = now.getMonth();
          const currY = now.getFullYear();

          snapshot.forEach((doc) => {
            const data = doc.data();
            const amt = parseFloat(data.amount) || 0;
            const type = data.type;
            
            let rowDate = new Date();
            if (data.date) {
              const parts = data.date.split('-');
              if (parts.length === 3) rowDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            }

            const isInc = (type === "വരവ്" || type === "Income" || type === "കടം തിരിച്ചു കിട്ടിയത്" || type === "കടം വാങ്ങിയത്" || type === "Borrowed Loan" || type === "Received Loan Repayment");

            if (isInc) tInc += amt; else tExp += amt;

            if (rowDate.getMonth() === currM && rowDate.getFullYear() === currY) {
              if (isInc) mInc += amt; else mExp += amt;
            }

            rawData.push({ ...data, parsedDate: rowDate });
          });

          document.getElementById('dashInc').innerText = '₹' + mInc.toFixed(2);
          document.getElementById('dashExp').innerText = '₹' + mExp.toFixed(2);
          
          const bal = tInc - tExp;
          const balEl = document.getElementById('dashBal');
          balEl.innerText = '₹' + bal.toFixed(2);
          balEl.className = 'metric-value ' + (bal < 0 ? 'val-exp' : 'val-inc');

          renderReport();
        });
    }

    function renderReport() {
      const mFilter = document.getElementById('filterMonth').value;
      const tFilter = document.getElementById('filterType').value;
      
      const now = new Date();
      const currM = now.getMonth();
      const currY = now.getFullYear();

      let list = rawData.filter(i => {
        if (mFilter === "THIS_MONTH" && (i.parsedDate.getMonth() !== currM || i.parsedDate.getFullYear() !== currY)) return false;
        if (tFilter === "INCOME") return (i.type === "വരവ്" || i.type === "Income");
        if (tFilter === "EXPENSE") return (i.type === "ചെലവ്" || i.type === "Expense");
        if (tFilter === "LOAN") return (i.type.includes("കടം") || i.type.includes("Loan"));
        return true;
      });

      list.sort((a, b) => b.parsedDate - a.parsedDate);

      let sumI = 0, sumE = 0;
      const tbody = document.getElementById('reportTableRows');
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 24px; color: var(--text-muted);">${dict[lang].no_records}</td></tr>`;
      } else {
        list.forEach(r => {
          const amt = parseFloat(r.amount) || 0;
          const isInc = (r.type === "വരവ്" || r.type === "Income" || r.type === "കടം തിരിച്ചു കിട്ടിയത്" || r.type === "കടം വാങ്ങിയത്" || r.type === "Borrowed Loan" || r.type === "Received Loan Repayment");
          
          if (isInc) sumI += amt; else sumE += amt;

          const d = r.parsedDate;
          const dtStr = String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="color: var(--text-muted);">${dtStr}</td>
            <td><strong>${r.category}</strong><br><small style="color: var(--text-muted);">${r.description || ''} ${r.person && r.person !== '-' ? '('+r.person+')' : ''}</small></td>
            <td class="badge-amt" style="color: ${isInc ? 'var(--income)' : 'var(--expense)'};">${isInc ? '+' : '-'}₹${amt.toFixed(2)}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('repIncSum').innerText = '₹' + sumI.toFixed(2);
      document.getElementById('repExpSum').innerText = '₹' + sumE.toFixed(2);
    }

    function handleTransactionSubmit(e) {
      e.preventDefault();
      if (!currentUser) return;

      const btn = document.getElementById('saveSubmitBtn');
      const alert = document.getElementById('formAlert');
      const amt = parseFloat(document.getElementById('entryAmount').value) || 0;
      
      let cat = document.getElementById('entryCategory').value;
      if (cat === 'NEW_CAT') cat = document.getElementById('customCategoryInput').value;

      btn.disabled = true;

      const payload = {
        date: document.getElementById('entryDate').value,
        type: document.getElementById('entryType').value,
        category: cat,
        amount: amt,
        description: document.getElementById('entryDesc').value || "-",
        person: document.getElementById('entryPerson').value || "-",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("users").doc(currentUser.uid).collection("transactions").add(payload)
        .then(() => {
          alert.className = "status-alert status-success";
          alert.innerText = dict[lang].success_save;
          alert.style.display = "block";

          document.getElementById('entryAmount').value = '';
          document.getElementById('entryDesc').value = '';
          document.getElementById('entryPerson').value = '';
          
          setTimeout(() => alert.style.display = "none", 3000);
          btn.disabled = false;
        })
        .catch(err => {
          alert.className = "status-alert status-error";
          alert.innerText = err.message;
          alert.style.display = "block";
          btn.disabled = false;
        });
    }

    /* POPUP CALCULATOR */
    let expr = "";
    function openCalc() {
      const val = document.getElementById('entryAmount').value;
      expr = val ? val.toString() : "";
      document.getElementById('calcScreen').value = expr || "0";
      document.getElementById('calcPopup').style.display = "flex";
    }
    function closeCalc() {
      document.getElementById('calcPopup').style.display = "none";
    }
    function calcPush(ch) {
      if (expr === "0" && ch !== ".") expr = ch; else expr += ch;
      document.getElementById('calcScreen').value = expr;
    }
    function calcClear() {
      expr = "";
      document.getElementById('calcScreen').value = "0";
    }
    function calcFinish() {
      try {
        if (!expr) { closeCalc(); return; }
        const res = Function('"use strict";return (' + expr + ')')();
        document.getElementById('entryAmount').value = parseFloat(res).toFixed(2);
        closeCalc();
      } catch {
        document.getElementById('calcScreen').value = "Error";
        expr = "";
      }
    }
  </script>
</body>
