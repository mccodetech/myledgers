<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Ledgers">
  
  <title>My Ledgers</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9554/9554904.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent: #38bdf8;
      --expense: #f43f5e;
      --income: #10b981;
      --loan: #6366f1;
      --vehicle: #8b5cf6;
      --reminder: #f59e0b;
      --whatsapp: #25d366;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif; -webkit-tap-highlight-color: transparent; }

    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }

    .home-grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    .grid-menu-card { 
      background: linear-gradient(135deg, #0284c7, #38bdf8); 
      border: 1.5px solid rgba(255, 255, 255, 0.3); 
      border-radius: var(--radius-lg); 
      padding: 20px 14px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: var(--shadow-md); 
      color: white;
    }
    .grid-menu-card:hover { transform: translateY(-2px); filter: brightness(1.03); }
    .grid-menu-card i { font-size: 26px; color: #ffffff; margin-bottom: 8px; background: rgba(255, 255, 255, 0.2); width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
    .grid-menu-card span { display: block; font-size: 13.5px; font-weight: 700; color: #ffffff; }

    .auth-wrapper { width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 36px 28px; border: 1px solid var(--border); }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .brand-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #0369a1, var(--primary)); color: white; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px; }
    .auth-header h2 { font-size: 24px; font-weight: 800; color: var(--text); }
    .auth-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .input-box { width: 100%; padding: 12px 16px; font-size: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); outline: none; background: #f8fafc; color: var(--text); }
    .input-box:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px var(--primary-light); }

    .btn-main { width: 100%; padding: 14px; border: none; background: linear-gradient(135deg, #0369a1, var(--primary)); color: white; font-size: 15px; font-weight: 700; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }

    .app-shell { width: 100%; max-width: 600px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--border); }
    .app-topbar { background: linear-gradient(135deg, #0369a1, #0284c7); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.2); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
    
    .dashboard-overview { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #f8fafc; border-bottom: 1px solid var(--border); }
    .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-card { background: var(--surface); padding: 12px 10px; border-radius: var(--radius-md); border: 1px solid var(--border); text-align: center; }
    .metric-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .metric-value { font-size: 15px; font-weight: 800; }
    .val-inc { color: var(--income); } .val-exp { color: var(--expense); } .val-bal { color: var(--text); }

    .app-content { padding: 20px 16px; }
    .type-pill-group { display: flex; background: #f1f5f9; padding: 4px; border-radius: var(--radius-full); gap: 4px; margin-bottom: 20px; }
    .type-pill { flex: 1; border: none; padding: 8px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; background: transparent; color: var(--text-muted); cursor: pointer; }
    .type-pill.active[data-mode="income"] { background: var(--income); color: white; }
    .type-pill.active[data-mode="expense"] { background: var(--expense); color: white; }
    .type-pill.active[data-mode="loan"] { background: var(--loan); color: white; }

    .table-responsive { overflow-x: auto; max-height: 380px; border: 1px solid var(--border); border-radius: var(--radius-md); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: #f8fafc; padding: 10px 12px; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 9999; padding: 16px; }
    .modal-dialog { background: var(--surface); width: 100%; max-width: 420px; border-radius: var(--radius-lg); padding: 20px; max-height: 85vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- AUTHENTICATION VIEW -->
  <div class="auth-wrapper" id="authView">
    <div class="auth-header">
      <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
      <h2>My Ledgers</h2>
      <p>Login to your account</p>
    </div>
    <form onsubmit="handleAuth(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="authEmail" class="input-box" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPass" class="input-box" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-main">Login</button>
    </form>
  </div>

  <!-- MAIN APP VIEW -->
  <div class="app-shell" id="mainAppView" style="display: none;">
    <div class="app-topbar">
      <div class="user-info">
        <div class="user-avatar" id="avatarInitial">U</div>
        <div>
          <div class="user-name" id="userNameLabel">User</div>
          <small style="font-size: 10px; opacity: 0.85;">My Ledgers</small>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn-icon-top" onclick="openSettingsModal()" title="Settings" style="background:none; border:none; color:white; font-size:18px; cursor:pointer; margin-right:10px;"><i class="fa-solid fa-gear"></i></button>
        <button type="button" class="btn-icon-top" onclick="auth.signOut()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard-overview">
      <div class="dash-row">
        <div class="metric-card">
          <div class="metric-label" data-i18n="dash_inc">This Month Income</div>
          <div class="metric-value val-inc" id="dashInc">₹0.00</div>
        </div>
        <div class="metric-card">
          <div class="metric-label" data-i18n="dash_exp">This Month Expense</div>
          <div class="metric-value val-exp" id="dashExp">₹0.00</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="dash_bal">Total Balance</div>
        <div class="metric-value val-bal" id="dashBal">₹0.00</div>
      </div>
    </div>

    <div class="app-content">
      <!-- HOME GRID MENU -->
      <div id="homeMenuView">
        <div style="font-size: 13.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;" data-i18n="main_menu">Main Menu</div>
        <div class="home-grid-menu">
          <div class="grid-menu-card" onclick="switchView('entry')">
            <i class="fa-solid fa-plus-circle"></i>
            <span data-i18n="tab_add">New Entry</span>
          </div>
          <div class="grid-menu-card" onclick="switchView('report')">
            <i class="fa-solid fa-chart-pie"></i>
            <span data-i18n="tab_report">Reports</span>
          </div>
          <div class="grid-menu-card" onclick="switchView('reminder')">
            <i class="fa-solid fa-bell"></i>
            <span data-i18n="tab_reminders">Reminders</span>
          </div>
          <div class="grid-menu-card" onclick="switchView('vehicle')">
            <i class="fa-solid fa-gas-pump"></i>
            <span data-i18n="tab_vehicle">Vehicle Tracker</span>
          </div>
        </div>
      </div>

      <!-- ENTRY SECTION WITH BREAKDOWN -->
      <div id="entrySection" style="display: none;">
        <button type="button" class="btn-main" style="background: #64748b; margin-bottom: 16px; padding: 10px;" onclick="switchView('home')"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_back">Back to Menu</span></button>
        <div class="type-pill-group">
          <button type="button" class="type-pill active" data-mode="income" onclick="setMode('income')" data-i18n="type_inc">Income</button>
          <button type="button" class="type-pill" data-mode="expense" onclick="setMode('expense')" data-i18n="type_exp">Expense</button>
          <button type="button" class="type-pill" data-mode="loan" onclick="setMode('loan')" data-i18n="type_loan">Loan</button>
        </div>
        <form onsubmit="handleTransactionSubmit(event)">
          <div class="form-group">
            <label data-i18n="lbl_date">Date</label>
            <input type="date" id="entryDate" class="input-box" required>
          </div>
          <div class="form-group">
            <label data-i18n="lbl_category">Category</label>
            <select id="entryCategory" class="input-box" required>
              <option value="Food">Food / Groceries</option>
              <option value="Travel">Travel / Transport</option>
              <option value="Rent">Rent / Bills</option>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="lbl_amount">Amount</label>
            <input type="number" step="0.01" id="entryAmount" class="input-box" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label data-i18n="lbl_description">Description / Breakdown (Travel: 500, Food: 300, etc.)</label>
            <input type="text" id="entryDesc" class="input-box" placeholder="Optional notes...">
          </div>
          <button type="submit" class="btn-main" data-i18n="btn_save">Save Entry</button>
        </form>
      </div>

      <!-- REPORT SECTION -->
      <div id="reportSection" style="display: none;">
        <button type="button" class="btn-main" style="background: #64748b; margin-bottom: 16px; padding: 10px;" onclick="switchView('home')"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_back">Back to Menu</span></button>
        <div class="table-responsive">
          <table>
            <thead>
              <tr><th data-i18n="th_date">Date</th><th data-i18n="th_details">Details</th><th data-i18n="th_amount">Amount</th></tr>
            </thead>
            <tbody id="reportTableRows"></tbody>
          </table>
        </div>
      </div>

      <!-- REMINDER SECTION -->
      <div id="reminderSection" style="display: none;">
        <button type="button" class="btn-main" style="background: #64748b; margin-bottom: 16px; padding: 10px;" onclick="switchView('home')"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_back">Back to Menu</span></button>
        <h3 style="font-size: 15px; margin-bottom: 12px;" data-i18n="title_upcoming_bills">Upcoming Reminders & Bills</h3>
        <div id="remindersListContainer"><p style="color:var(--text-muted); font-size:13px;" data-i18n="no_reminders">No active reminders</p></div>
      </div>

      <!-- VEHICLE SECTION -->
      <div id="vehicleSection" style="display: none;">
        <button type="button" class="btn-main" style="background: #64748b; margin-bottom: 16px; padding: 10px;" onclick="switchView('home')"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_back">Back to Menu</span></button>
        <h3 style="font-size: 15px; margin-bottom: 10px;" data-i18n="tab_vehicle">Vehicle Tracker & Maintenance</h3>
        <div class="form-group">
          <label>Vehicle Name</label>
          <input type="text" id="vehNameInput" class="input-box" placeholder="Swift / Activa">
        </div>
        <div class="form-group">
          <label>Odometer Km</label>
          <input type="number" id="vehOdoInput" class="input-box" placeholder="45200">
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" step="0.01" id="vehAmountInput" class="input-box" placeholder="1500">
        </div>
        <button type="button" class="btn-main" style="background: var(--vehicle);" onclick="saveVehicleServiceLog()">Save Log</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-dialog">
      <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:8px;">
        <h3>Settings</h3>
        <button type="button" onclick="closeSettingsModal()" style="background:none; border:none; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <div class="form-group">
        <label>Language (ഭാഷ)</label>
        <select id="settingsLangSelect" class="input-box">
          <option value="en">English</option>
          <option value="ml">മലയാളം (Malayalam)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Currency (കറൻസി)</label>
        <select id="settingsCurrencySelect" class="input-box">
          <option value="₹">₹ - INR</option>
          <option value="$">$ - USD</option>
          <option value="AED ">AED</option>
          <option value="SAR ">SAR</option>
        </select>
      </div>
      <button type="button" class="btn-main" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFf3lvoWEBsEbFOFR5uKIuZDPEi_I12nE",
      authDomain: "my-ledgers-471e4.firebaseapp.com",
      projectId: "my-ledgers-471e4",
      storageBucket: "my-ledgers-471e4.firebasestorage.app",
      messagingSenderId: "8614518992",
      appId: "1:8614518992:web:00d23f236cda38de5b7ed5"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let lang = localStorage.getItem('app_lang') || 'en';
    let userCurrency = localStorage.getItem('app_currency') || '₹';

    const dict = {
      en: {
        dash_inc: "This Month Income", dash_exp: "This Month Expense", dash_bal: "Total Balance",
        main_menu: "Main Menu", tab_add: "New Entry", tab_report: "Reports", tab_reminders: "Reminders",
        tab_vehicle: "Vehicle Tracker", type_inc: "Income", type_exp: "Expense", type_loan: "Loan",
        lbl_date: "Date", lbl_category: "Category", lbl_amount: "Amount", lbl_description: "Description / Breakdown",
        btn_save: "Save Entry", btn_back: "Back to Menu", th_date: "Date", th_details: "Details", th_amount: "Amount",
        title_upcoming_bills: "Upcoming Reminders", no_reminders: "No active reminders"
      },
      ml: {
        dash_inc: "ഈ മാസത്തെ വരവ്", dash_exp: "ഈ മാസത്തെ ചെലവ്", dash_bal: "ആകെ ബാക്കി തുക",
        main_menu: "പ്രധാന മെനു", tab_add: "ഇടപാട് ചേർക്കുക", tab_report: "റിപ്പോർട്ടുകൾ", tab_reminders: "ബിൽ റിമൈൻഡർ",
        tab_vehicle: "വാഹന ട്രാക്കർ", type_inc: "വരവ്", type_exp: "ചെലവ്", type_loan: "കടം",
        lbl_date: "തീയതി", lbl_category: "വിഭാഗം", lbl_amount: "തുക", lbl_description: "വിവരണം / ട്രിപ്പ് ബ്രേക്ക്ഡൗൺ",
        btn_save: "രേഖപ്പെടുത്തുക", btn_back: "തിരികെ മെനുവിലേക്ക്", th_date: "തീയതി", th_details: "വിവരണം", th_amount: "തുക",
        title_upcoming_bills: "വരാനിരിക്കുന്ന റിമൈൻഡറുകൾ", no_reminders: "റിമൈൻഡറുകൾ ഒന്നുമില്ല"
      }
    };

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('authView').style.display = 'none';
        document.getElementById('mainAppView').style.display = 'block';
        switchView('home');
        applyLanguage(lang);
      } else {
        document.getElementById('mainAppView').style.display = 'none';
        document.getElementById('authView').style.display = 'block';
      }
    });

    function applyLanguage(l) {
      document.documentElement.setAttribute('dir', 'ltr');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[l] && dict[l][key]) el.innerText = dict[l][key];
      });
    }

    function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }
    function saveSettings() {
      lang = document.getElementById('settingsLangSelect').value;
      userCurrency = document.getElementById('settingsCurrencySelect').value;
      localStorage.setItem('app_lang', lang);
      localStorage.setItem('app_currency', userCurrency);
      applyLanguage(lang);
      closeSettingsModal();
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPass').value;
      auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.name + ": " + err.message));
    }

    function switchView(view) {
      document.getElementById('homeMenuView').style.display = (view === 'home') ? 'block' : 'none';
      document.getElementById('entrySection').style.display = (view === 'entry') ? 'block' : 'none';
      document.getElementById('reportSection').style.display = (view === 'report') ? 'block' : 'none';
      document.getElementById('reminderSection').style.display = (view === 'reminder') ? 'block' : 'none';
      document.getElementById('vehicleSection').style.display = (view === 'vehicle') ? 'block' : 'none';
    }

    function setMode(mode) {
      document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
      document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
    }

    function handleTransactionSubmit(e) {
      e.preventDefault();
      alert("വിവരങ്ങൾ വിജയകരമായി രേഖപ്പെടുത്തി!");
      switchView('home');
    }

    function saveVehicleServiceLog() {
      alert("വാഹനത്തിന്റെ വിവരങ്ങൾ സേവ് ചെയ്തു!");
      switchView('home');
    }
  </script>
</body>
</html>
